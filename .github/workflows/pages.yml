# Publishes the site to GitHub Pages on every push to main.
#
# Enable it once in Settings → Pages → Source → GitHub Actions, then this runs
# itself. Having the site live at a real URL matters: it is what goes on the
# projector, and it is what a contributor sends their friends.
name: Deploy to Pages

on:
  push:
    branches: [main]
  # Pull requests that the auto-merge workflow merges are merged with the
  # built-in GITHUB_TOKEN, and GitHub does not start new workflow runs for
  # events caused by that token. Without a schedule the live site (and the
  # contributor wall) would stay out of date after every such merge.
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Make sure the published wall is current even if the index commit is
      # still in flight.
      - name: Refresh the contributor index
        run: python3 scripts/build_contributors.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
